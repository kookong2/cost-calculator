<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d6cdf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="대행 계산기">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>대행 계산기</title>
<style>
* { box-sizing: border-box; }
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 15px;
}
.container {
    max-width: 480px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
}
h2 {
    text-align: center;
    margin-bottom: 15px;
}
.mode-group, .type-group {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}
button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-weight: bold;
    cursor: pointer;
}
.mode-btn { background: #ddd; }
.mode-btn.active { background: #2d6cdf; color: white; }
.type-btn { background: #eee; }
.type-btn.active { background: #1b4db5; color: white; }
input, select {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 16px;
}
.calculate { background: #28a745; color: white; }
.result {
    margin-top: 10px;
    padding: 12px;
    background: #f0f4ff;
    border-radius: 10px;
    text-align: center;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    white-space: pre-wrap;
}
.result-row {
    display: flex;
    align-items: center;
    gap: 8px;
}
.result-row .result {
    flex: 1;
    min-width: 0;
}
.yuan-info {
    flex: 0 0 auto;
    color: #555;
    font-size: 14px;
    font-weight: bold;
    white-space: nowrap;
}
.yuan-info:empty { display: none; }
.ledger-section {
    margin: 12px 0;
    padding: 12px;
    border: 1px solid #d8e2f5;
    border-radius: 10px;
    background: #f8faff;
}
.ledger-section summary {
    cursor: pointer;
    font-weight: bold;
    margin-bottom: 10px;
}
.ledger-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 10px;
}
.ledger-add {
    flex: 0 0 auto;
    padding: 8px 10px;
    background: #ff9800;
    color: white;
    white-space: nowrap;
}
.ledger-add:disabled { background: #aaa; cursor: default; }
.ledger-actions {
    display: grid;
    gap: 8px;
}
.ledger-actions .ledger-add { width: 100%; }
.ledger-status {
    min-height: 18px;
    color: #1b5e20;
    font-size: 12px;
    text-align: center;
}
.hidden { display: none; }
.note {
    font-size: 12px;
    text-align: center;
    color: green;
    margin-top: 5px;
}
</style>
</head>
<body>

<div class="container">
<h2>대행 계산기</h2>

<div class="mode-group">
    <button class="mode-btn" onclick="switchMode('cost')" id="costMode">원가 계산</button>
    <button class="mode-btn active" onclick="switchMode('final')" id="finalMode">금액 전달</button>
    <button class="mode-btn" onclick="switchMode('message')" id="messageMode">멘트 복사</button>
</div>

<div id="calculatorArea">
    <div class="type-group">
        <button class="type-btn active" onclick="selectType('progress')" id="progressBtn">진행계</button>
        <button class="type-btn" onclick="selectType('stone')" id="stoneBtn">돌계</button>
    </div>

    <div id="costSection" class="hidden">
        <input type="number" id="finalAmount" placeholder="최종 금액 입력">
    </div>

    <div id="finalSection">
        <input type="number" id="accountCost" placeholder="계정 원가 입력">

        <div id="progressExtra">
            <input type="number" id="insuranceCost" placeholder="보험비 (없으면 0)">
            <input type="number" id="phoneCost" value="15" placeholder="중국 전화번호 비용 (기본 15)">
            <input type="number" id="serviceCost" value="16" placeholder="서비스료 (기본 16)">
        </div>
    </div>

    <input type="number" id="exchange" value="213" placeholder="환율">

    <details class="ledger-section hidden" id="ledgerSection" open>
        <summary>장부 입력 정보</summary>
        <input type="text" id="ledgerPurchaseCode" placeholder="구매코드 또는 아이템 URL">
        <div class="ledger-grid">
            <select id="ledgerPaymentMethod" aria-label="결제수단">
                <option value="">결제수단 선택</option>
                <option value="qr충전">qr충전</option>
                <option value="qr결제">qr결제</option>
                <option value="오전결제">오전결제</option>
                <option value="재화결제">재화결제</option>
            </select>
            <input type="date" id="ledgerTradeDate" aria-label="거래일자">
        </div>
        <label for="ledgerTradeTime">거래 시간</label>
        <input type="time" id="ledgerTradeTime" aria-label="거래 시간">
        <input type="text" id="ledgerMemo" placeholder="메모 (선택)">
        <div class="ledger-actions">
            <button class="ledger-add hidden" id="ledgerBtnCost" onclick="addToLedger('cost')">원가 계산 결과 장부 입력</button>
            <button class="ledger-add hidden" id="ledgerBtn1" onclick="addToLedger('base')">보험 포함 장부 입력</button>
            <button class="ledger-add hidden" id="ledgerBtn2" onclick="addToLedger('noInsurance')">보험 미포함 장부 입력</button>
            <button class="ledger-add hidden" id="ledgerBtn3" onclick="addToLedger('hiChina')">하이차이나 보험 장부 입력</button>
        </div>
        <div class="ledger-status" id="ledgerStatus"></div>
    </details>

    <button class="calculate" id="calculateButton" onclick="calculate()">계산하기</button>

    <div class="result" id="result" onclick="copyText('result')"></div>
    <div class="result-row">
        <div class="result" id="result1" onclick="copyText('result1')"></div>
        <span class="yuan-info" id="yuan1"></span>
    </div>
    <div class="result-row">
        <div class="result" id="result2" onclick="copyText('result2')"></div>
        <span class="yuan-info" id="yuan2"></span>
    </div>
    <div class="result-row">
        <div class="result" id="result3" onclick="copyText('result3')"></div>
        <span class="yuan-info" id="yuan3"></span>
    </div>
    <div class="result" id="result4" onclick="copyText('result4')"></div>
    <div class="result" id="result5" onclick="copyText('result5')"></div>
</div>

<div id="messageSection" class="hidden">
    <div class="result" id="message1" onclick="copyText('message1')">판매자 답변을 기다리는 중이므로 기다려주시면 감사드리겠습니다!</div>
    <div class="result" id="message2" onclick="copyText('message2')">확인해주시고 문제 없으면 이메일과 전화번호 입력해주세요.</div>
    <div class="result" id="message3" onclick="copyText('message3')">전화번호 변경 및 비밀번호 변경 후 말씀해주세요.</div>
    <div class="result" id="message4" onclick="copyText('message4')">링크 주시면 금액 확인해드리겠습니다.</div>
    <div class="result" id="message5" onclick="copyText('message5')">환불 신청 넣겠습니다. 환불은 익일 중으로 처리될 예정입니다.</div>
</div>

<div class="note" id="copiedText"></div>
<iframe class="hidden" id="ledgerFrame" name="ledgerFrame" title="장부 전송"></iframe>
</div>

<script>
let mode = "final";
let type = "progress";
let ledgerResults = {};
const LEDGER_ENDPOINT = "https://script.google.com/macros/s/AKfycbyUZq0GIQZtMWLrUpvStZvq7-iuAGG5i0ql2_9YDCtTqLMQb6qn1iYByPUIk1IZIoDn/exec";

function resetLedgerActions() {
    const buttonLabels = {
        ledgerBtnCost: "원가 계산 결과 장부 입력",
        ledgerBtn1: "보험 포함 장부 입력",
        ledgerBtn2: "보험 미포함 장부 입력",
        ledgerBtn3: "하이차이나 보험 장부 입력"
    };
    ledgerResults = {};
    Object.keys(buttonLabels).forEach(function(id) {
        const button = document.getElementById(id);
        button.classList.add("hidden");
        button.disabled = false;
        button.innerText = buttonLabels[id];
    });
}

function switchMode(selected) {
    mode = selected;
    resetLedgerActions();
    document.getElementById("ledgerSection").classList.toggle("hidden", selected !== "cost");
    document.getElementById("costMode").classList.remove("active");
    document.getElementById("finalMode").classList.remove("active");
    document.getElementById("messageMode").classList.remove("active");

    if (selected === "cost") {
        document.getElementById("costMode").classList.add("active");
        document.getElementById("calculatorArea").classList.remove("hidden");
        document.getElementById("messageSection").classList.add("hidden");
        document.getElementById("costSection").classList.remove("hidden");
        document.getElementById("finalSection").classList.add("hidden");
    } else if (selected === "final") {
        document.getElementById("finalMode").classList.add("active");
        document.getElementById("calculatorArea").classList.remove("hidden");
        document.getElementById("messageSection").classList.add("hidden");
        document.getElementById("finalSection").classList.remove("hidden");
        document.getElementById("costSection").classList.add("hidden");
    } else {
        document.getElementById("messageMode").classList.add("active");
        document.getElementById("calculatorArea").classList.add("hidden");
        document.getElementById("messageSection").classList.remove("hidden");
    }
}

function selectType(selected) {
    type = selected;
    document.getElementById("progressBtn").classList.remove("active");
    document.getElementById("stoneBtn").classList.remove("active");

    if (selected === "progress") {
        document.getElementById("progressBtn").classList.add("active");
        document.getElementById("progressExtra").style.display = "block";
    } else {
        document.getElementById("stoneBtn").classList.add("active");
        document.getElementById("progressExtra").style.display = "none";
    }
}

function clearExtraResults() {
    document.getElementById("result1").innerText = "";
    document.getElementById("result2").innerText = "";
    document.getElementById("result3").innerText = "";
    document.getElementById("result4").innerText = "";
    document.getElementById("result5").innerText = "";
    document.getElementById("yuan1").innerText = "";
    document.getElementById("yuan2").innerText = "";
    document.getElementById("yuan3").innerText = "";
    resetLedgerActions();
}

function calculate() {
    if (mode === "message") return;

    const exchange = parseFloat(document.getElementById("exchange").value);
    if (isNaN(exchange)) return;

    if (mode === "cost") {
        const finalAmount = parseFloat(document.getElementById("finalAmount").value);
        if (isNaN(finalAmount)) return;

        let result = type === "progress"
            ? (finalAmount - 12000) / 1.1 / exchange
            : (finalAmount - 4000) / 1.1 / exchange;

        result = Math.floor(result);

        clearExtraResults();
        document.getElementById("result").innerText = result.toLocaleString();
        ledgerResults = {
            cost: { yuan: result, sales: finalAmount, requestId: createRequestId() }
        };
        const costButton = document.getElementById("ledgerBtnCost");
        costButton.classList.remove("hidden");
        costButton.disabled = false;
        costButton.innerText = "원가 계산 결과 장부 입력";
    } else {
        const accountCost = parseFloat(document.getElementById("accountCost").value);
        if (isNaN(accountCost)) return;

        if (type === "progress") {
            const phoneCost = parseFloat(document.getElementById("phoneCost").value) || 0;
            const serviceCost = parseFloat(document.getElementById("serviceCost").value) || 0;
            const insuranceCost = parseFloat(document.getElementById("insuranceCost").value) || 0;

            const baseChinaCost = accountCost + phoneCost + serviceCost + insuranceCost;
            const noInsuranceChinaCost = accountCost + phoneCost + serviceCost;
            const basePrice = baseChinaCost * exchange * 1.1 + 12000;
            const noInsurancePrice = noInsuranceChinaCost * exchange * 1.1 + 12000;
            const hiChinaInsurance = Math.ceil(accountCost * 0.15);
            const hiChinaChinaCost = Math.ceil(accountCost + hiChinaInsurance + phoneCost + serviceCost);
            const hiChinaPrice = hiChinaChinaCost * exchange * 1.1 + 12000;

            const finalBase = Math.ceil(basePrice);
            const finalNoInsurance = Math.ceil(noInsurancePrice);
            const finalHiChina = Math.ceil(hiChinaPrice);

            document.getElementById("result").innerText = finalBase.toLocaleString();
            document.getElementById("result1").innerText =
                "보험 및 중국 전화번호(30일 유효 포함) " + finalBase.toLocaleString() + "입니다^^.";
            document.getElementById("result2").innerText =
                "보험비 미포함 가격 " + finalNoInsurance.toLocaleString() + "입니다^^.";
            document.getElementById("result3").innerText =
                "하이차이나 보험 가격 " + finalHiChina.toLocaleString() + "입니다^^.";
            document.getElementById("yuan1").innerText = baseChinaCost.toLocaleString() + "위안";
            document.getElementById("yuan2").innerText = noInsuranceChinaCost.toLocaleString() + "위안";
            document.getElementById("yuan3").innerText = hiChinaChinaCost.toLocaleString() + "위안";
            ledgerResults = {
                base: { yuan: baseChinaCost, sales: finalBase, requestId: createRequestId() },
                noInsurance: { yuan: noInsuranceChinaCost, sales: finalNoInsurance, requestId: createRequestId() },
                hiChina: { yuan: hiChinaChinaCost, sales: finalHiChina, requestId: createRequestId() }
            };
            const buttonLabels = {
                ledgerBtn1: "보험 포함 장부 입력",
                ledgerBtn2: "보험 미포함 장부 입력",
                ledgerBtn3: "하이차이나 보험 장부 입력"
            };
            Object.keys(buttonLabels).forEach(function(id) {
                const button = document.getElementById(id);
                button.classList.remove("hidden");
                button.disabled = false;
                button.innerText = buttonLabels[id];
            });
            document.getElementById("result4").innerText =
                "보험비 포함 구매해주세요";
            document.getElementById("result5").innerText =
                "하이차이나 보험 " + hiChinaChinaCost.toLocaleString() + "위안 구매해주세요";
        } else {
            const stonePrice = accountCost * exchange * 1.1 + 4000;
            const finalStone = Math.ceil(stonePrice);

            document.getElementById("result").innerText = finalStone.toLocaleString();
            clearExtraResults();
        }
    }

    document.getElementById("copiedText").innerText = "";
}

function copyText(id) {
    const text = document.getElementById(id).innerText;
    if (!text) return;
    navigator.clipboard.writeText(text);
    document.getElementById("copiedText").innerText = "복사되었습니다.";
}

function createRequestId() {
    if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
    }
    return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
}

function addToLedger(resultType) {
    if (mode !== "cost" || resultType !== "cost") return;
    const ledgerResult = ledgerResults[resultType];
    if (!ledgerResult) return;

    const purchaseCode = document.getElementById("ledgerPurchaseCode").value.trim();
    const paymentMethod = document.getElementById("ledgerPaymentMethod").value;
    const tradeDate = document.getElementById("ledgerTradeDate").value;
    const tradeTime = document.getElementById("ledgerTradeTime").value;
    const memo = document.getElementById("ledgerMemo").value.trim();

    if (!purchaseCode && !paymentMethod) {
        document.getElementById("ledgerStatus").innerText = "구매코드 또는 결제수단을 입력해주세요.";
        document.getElementById("ledgerSection").open = true;
        return;
    }
    if (!tradeDate) {
        document.getElementById("ledgerStatus").innerText = "거래일자를 입력해주세요.";
        return;
    }
    if (!tradeTime) {
        document.getElementById("ledgerStatus").innerText = "거래 시간을 입력해주세요.";
        return;
    }

    const buttonIds = { cost: "ledgerBtnCost", base: "ledgerBtn1", noInsurance: "ledgerBtn2", hiChina: "ledgerBtn3" };
    const button = document.getElementById(buttonIds[resultType]);
    button.disabled = true;
    button.innerText = "전송됨";

    const fields = {
        yuan: ledgerResult.yuan,
        sales: ledgerResult.sales,
        purchaseCode: purchaseCode,
        paymentMethod: paymentMethod,
        memo: [memo, "거래 시간 " + tradeTime].filter(Boolean).join(" / "),
        tradeDate: tradeDate,
        tradeTime: tradeTime,
        requestId: ledgerResult.requestId
    };
    const form = document.createElement("form");
    form.method = "POST";
    form.action = LEDGER_ENDPOINT;
    form.target = "ledgerFrame";

    Object.keys(fields).forEach(function(name) {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = name;
        input.value = fields[name];
        form.appendChild(input);
    });

    document.body.appendChild(form);
    form.submit();
    form.remove();
    document.getElementById("ledgerStatus").innerText = "장부 대기열로 전송 요청했습니다.";
}

function initializeLedger() {
    const today = new Date();
    const localDate = new Date(today.getTime() - today.getTimezoneOffset() * 60000)
        .toISOString().slice(0, 10);
    document.getElementById("ledgerTradeDate").value = localDate;
    document.getElementById("ledgerTradeTime").value =
        String(today.getHours()).padStart(2, "0") + ":" + String(today.getMinutes()).padStart(2, "0");

}

document.addEventListener("keydown", function(event) {
    if (event.key === "Enter") calculate();
});

if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js");
    });
}

initializeLedger();
</script>

</body>
</html>
